<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Masaüstü Asistan</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000000; color: #00f3ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  /* Göz Alanı */
  #face {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative;
  }

  svg#eyes {
    width: min(85vw, 520px);
    height: auto;
    overflow: visible;
    filter: drop-shadow(0 0 18px rgba(0, 243, 255, 0.65));
    transition: transform 0.35s ease, filter 0.35s ease;
  }

  .eye {
    fill: #00f3ff;
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.22s cubic-bezier(0.25, 1, 0.5, 1), rx 0.25s ease, ry 0.25s ease, opacity 0.4s ease;
  }

  /* Durum Animasyonları */
  body.blink .eye { transform: scaleY(0.06); }

  body.listening svg#eyes {
    filter: drop-shadow(0 0 28px rgba(0, 243, 255, 0.95));
    transform: scale(1.06);
  }
  body.listening .eye { transform: scaleY(1.08); }

  body.thinking .eye {
    transform: scaleY(0.55);
    animation: thinkScan 1.1s infinite ease-in-out alternate;
  }
  @keyframes thinkScan {
    0% { transform: translateX(-16px) scaleY(0.55); }
    100% { transform: translateX(16px) scaleY(0.55); }
  }

  body.speaking .eye {
    animation: speakBounce 0.35s infinite ease-in-out alternate;
  }
  @keyframes speakBounce {
    0% { transform: scaleY(0.88) scaleX(1.03); }
    100% { transform: scaleY(1.06) scaleX(0.98); }
  }

  body.sleep svg#eyes {
    filter: drop-shadow(0 0 8px rgba(0, 243, 255, 0.3));
  }
  body.sleep .eye {
    transform: scaleY(0.08);
    animation: sleepBreath 3.5s infinite ease-in-out;
  }
  @keyframes sleepBreath {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.65; }
  }

  /* Dinleme Dalga Çizgisi */
  #wave {
    position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%);
    width: 140px; height: 4px; border-radius: 4px;
    background: #00f3ff; opacity: 0;
    box-shadow: 0 0 12px #00f3ff;
    transition: opacity 0.25s ease;
  }
  body.listening #wave {
    opacity: 1;
    animation: pulseWave 0.7s infinite ease-in-out alternate;
  }
  @keyframes pulseWave {
    0% { width: 70px; opacity: 0.5; }
    100% { width: 200px; opacity: 1; }
  }

  /* Altyazı Şeridi */
  #subtitle {
    position: fixed; bottom: 16px; left: 5%; width: 90%;
    text-align: center; font-size: 14px; line-height: 1.4;
    color: rgba(0, 243, 255, 0.85);
    text-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
    pointer-events: none;
    word-wrap: break-word;
  }

  /* Gizli Ayarlar Butonu (Sağ Üst) */
  #settingsBtn {
    position: fixed; top: 14px; right: 14px;
    width: 36px; height: 36px; border-radius: 50%;
    background: transparent; border: 1px solid rgba(0, 243, 255, 0.18);
    color: rgba(0, 243, 255, 0.35); font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 10;
  }

    position: fixed; inset: 0; background: rgba(0, 0, 0, 0
