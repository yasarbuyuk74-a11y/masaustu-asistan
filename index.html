<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Masaüstü Asistan</title>
<style>
  * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    background: #000000; color: #00f3ff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
  }

  #face {
    width: 100%; height: 100%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; position: relative;
  }

  svg#eyes {
    width: min(85vw, 520px);
    height: auto;
    overflow: visible;
    filter: drop-shadow(0 0 18px rgba(0, 243, 255, 0.65));
    transition: transform 0.35s ease, filter 0.35s ease;
  }

  .eye {
    fill: #00f3ff;
    transform-box: fill-box;
    transform-origin: center;
    transition: transform 0.22s cubic-bezier(0.25, 1, 0.5, 1), rx 0.25s ease, ry 0.25s ease, opacity 0.4s ease;
  }

  body.blink .eye { transform: scaleY(0.06); }

  body.listening svg#eyes {
    filter: drop-shadow(0 0 28px rgba(0, 243, 255, 0.95));
    transform: scale(1.06);
  }
  body.listening .eye { transform: scaleY(1.08); }

  body.thinking .eye {
    transform: scaleY(0.55);
    animation: thinkScan 1.1s infinite ease-in-out alternate;
  }
  @keyframes thinkScan {
    0% { transform: translateX(-16px) scaleY(0.55); }
    100% { transform: translateX(16px) scaleY(0.55); }
  }

  body.speaking .eye {
    animation: speakBounce 0.35s infinite ease-in-out alternate;
  }
  @keyframes speakBounce {
    0% { transform: scaleY(0.88) scaleX(1.03); }
    100% { transform: scaleY(1.06) scaleX(0.98); }
  }

  body.sleep svg#eyes {
    filter: drop-shadow(0 0 8px rgba(0, 243, 255, 0.3));
  }
  body.sleep .eye {
    transform: scaleY(0.08);
    animation: sleepBreath 3.5s infinite ease-in-out;
  }
  @keyframes sleepBreath {
    0%, 100% { opacity: 0.25; }
    50% { opacity: 0.65; }
  }

  #wave {
    position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%);
    width: 140px; height: 4px; border-radius: 4px;
    background: #00f3ff; opacity: 0;
    box-shadow: 0 0 12px #00f3ff;
    transition: opacity 0.25s ease;
  }
  body.listening #wave {
    opacity: 1;
    animation: pulseWave 0.7s infinite ease-in-out alternate;
  }
  @keyframes pulseWave {
    0% { width: 70px; opacity: 0.5; }
    100% { width: 200px; opacity: 1; }
  }

  #subtitle {
    position: fixed; bottom: 16px; left: 5%; width: 90%;
    text-align: center; font-size: 14px; line-height: 1.4;
    color: rgba(0, 243, 255, 0.85);
    text-shadow: 0 0 8px rgba(0, 243, 255, 0.4);
    pointer-events: none;
    word-wrap: break-word;
  }

  #settingsBtn {
    position: fixed; top: 14px; right: 14px;
    width: 36px; height: 36px; border-radius: 50%;
    background: transparent; border: 1px solid rgba(0, 243, 255, 0.25);
    color: rgba(0, 243, 255, 0.5); font-size: 16px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 10;
  }

  #modal {
    position: fixed; inset: 0; background: rgba(0, 0, 0, 0.92);
    display: none; align-items: center; justify-content: center; z-index: 20;
  }
  #modal.open { display: flex; }
  .card {
    width: min(90vw, 380px); padding: 20px; border-radius: 14px;
    background: #0b1116; border: 1px solid rgba(0, 243, 255, 0.35);
    display: flex; flex-direction: column; gap: 12px;
  }
  .card h3 { margin: 0; font-size: 16px; color: #00f3ff; }
  .card input {
    width: 100%; padding: 10px 12px; border-radius: 8px;
    border: 1px solid rgba(0, 243, 255, 0.3);
    background: #000; color: #fff; font-size: 13px;
    user-select: text;
  }
  .row { display: flex; gap: 10px; justify-content: flex-end; }
  .btn {
    padding: 9px 16px; border-radius: 8px; border: none;
    font-size: 14px; cursor: pointer; font-weight: 600;
  }
  .btn-save { background: #00f3ff; color: #000; }
  .btn-cancel { background: #1c262e; color: #aaa; }
</style>
</head>
<body class="idle">

<div id="face">
  <svg id="eyes" viewBox="0 0 420 180">
    <g id="eyeGroup">
      <rect class="eye" id="leftEye" x="45" y="25" width="130" height="130" rx="34" ry="34"/>
      <rect class="eye" id="rightEye" x="245" y="25" width="130" height="130" rx="34" ry="34"/>
    </g>
  </svg>
</div>

<div id="wave"></div>
<div id="subtitle">Konuşmak için ekrana dokunun</div>
<button id="settingsBtn" title="Ayarlar">⚙</button>

<div id="modal">
  <div class="card">
    <h3>Gemini API Ayarı</h3>
    <input type="text" id="apiKeyInput" placeholder="AIza... ile başlayan anahtarı yapıştırın" autocomplete="off" spellcheck="false">
    <div class="row">
      <button class="btn btn-cancel" id="closeModal">Kapat</button>
      <button class="btn btn-save" id="saveKey">Kaydet</button>
    </div>
  </div>
</div>

<script>
  const body = document.body;
  const eyeGroup = document.getElementById("eyeGroup");
  const subtitle = document.getElementById("subtitle");
  const modal = document.getElementById("modal");
  const apiKeyInput = document.getElementById("apiKeyInput");

  let state = "idle";
  let sleepTimer = null;
  let recognition = null;
  let ttsUnlocked = false;

  function setState(newState, text = "") {
    state = newState;
    body.className = newState;
    if (text) subtitle.textContent = text;
    resetSleepTimer();
  }

  function resetSleepTimer() {
    clearTimeout(sleepTimer);
    if (state === "idle") {
      sleepTimer = setTimeout(() => {
        if (state === "idle") {
          eyeGroup.style.transform = "translate(0px, 0px)";
          setState("sleep", "");
        }
      }, 45000);
    }
  }

  setInterval(() => {
    if (state === "idle" && Math.random() < 0.7) {
      body.classList.add("blink");
      setTimeout(() => body.classList.remove("blink"), 160);
    }
  }, 3400);

  setInterval(() => {
    if (state === "idle") {
      const dx = Math.floor((Math.random() - 0.5) * 44);
      const dy = Math.floor((Math.random() - 0.5) * 24);
      eyeGroup.style.transition = "transform 0.5s ease";
      eyeGroup.style.transform = `translate(${dx}px, ${dy}px)`;
    } else {
      eyeGroup.style.transform = "translate(0px, 0px)";
    }
  }, 4200);

  // Android/Mobil tarayıcıda ses motorunu ilk dokunuşta uyandır
  function unlockTTS() {
    if (ttsUnlocked || !("speechSynthesis" in window)) return;
    const silent = new SpeechSynthesisUtterance("");
    silent.volume = 0;
    window.speechSynthesis.speak(silent);
    ttsUnlocked = true;
  }

  function speak(text) {
    if (!("speechSynthesis" in window)) {
      setState("idle", text);
      return;
    }
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = "tr-TR";
    utter.rate = 1.05;
    utter.onstart = () => setState("speaking", text);
    utter.onend = () => setState("idle", "");
    utter.onerror = () => setState("idle", text);
    window.speechSynthesis.speak(utter);
  }

  async function askGemini(promptText, attempt = 1) {
    const rawKey = localStorage.getItem("gemini_api_key") || "";
    const apiKey = rawKey.replace(/\s+/g, "");
    if (!apiKey) {
      setState("idle", "Önce sağ üstten API anahtarını girin.");
      modal.classList.add("open");
      return;
    }

    setState("thinking", attempt > 1 ? `Tekrar deneniyor (${attempt})...` : "Düşünüyor...");
    try {
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent?key=${encodeURIComponent(apiKey)}`;
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system_instruction: {
            parts: [{ text: "Sen masaüstü bir sesli asistansın. Yanıtların çok kısa, doğal, samimi ve sesli okunmaya uygun Türkçe cümleler olsun. Markdown veya yıldız işareti kullanma." }]
          },
          contents: [{ parts: [{ text: promptText }] }]
        })
      });
      const data = await res.json();
      const reply = data?.candidates?.[0]?.content?.parts?.[0]?.text;

      if (reply) {
        speak(reply.trim());
      } else {
        const errMsg = data?.error?.message || "Bilinmeyen hata";
        // Yoğunluk hatasıysa 2 saniye bekleyip en fazla 2 kez otomatik dene
        if ((res.status === 503 || res.status === 429 || errMsg.toLowerCase().includes("high demand")) && attempt < 3) {
          setTimeout(() => askGemini(promptText, attempt + 1), 2000);
          return;
        }
        setState("idle", "Hata: " + errMsg);
      }
    } catch (err) {
      setState("idle", "Bağlantı hatası: " + err.message);
    }
  }

  function startListening() {
    unlockTTS();
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) {
      setState("idle", "Bu tarayıcı sesli komut desteklemiyor.");
      return;
    }

    window.speechSynthesis.cancel();
    recognition = new SpeechRecognition();
    recognition.lang = "tr-TR";
    recognition.interimResults = false;

    recognition.onstart = () => setState("listening", "Dinliyorum...");
    recognition.onresult = (e) => {
      const transcript = e.results[0][0].transcript;
      subtitle.textContent = transcript;
      askGemini(transcript);
    };
    recognition.onerror = () => setState("idle", "Seni duyamadım, tekrar dokun.");
    recognition.onend = () => {
      if (state === "listening") setState("idle", "");
    };
    recognition.start();
  }

  document.getElementById("face").addEventListener("click", () => {
    if (state === "listening" && recognition) {
      recognition.stop();
      setState("idle", "");
      return;
    }
    if (state === "speaking") {
      window.speechSynthesis.cancel();
      setState("idle", "");
      return;
    }
    startListening();
  });

  document.getElementById("settingsBtn").addEventListener("click", (e) => {
    e.stopPropagation();
    apiKeyInput.value = localStorage.getItem("gemini_api_key") || "";
    modal.classList.add("open");
  });
  document.getElementById("closeModal").addEventListener("click", () => modal.classList.remove("open"));
  document.getElementById("saveKey").addEventListener("click", () => {
    const cleaned = apiKeyInput.value.replace(/\s+/g, "");
    localStorage.setItem("gemini_api_key", cleaned);
    modal.classList.remove("open");
    setState("idle", "API anahtarı kaydedildi (" + cleaned.length + " karakter).");
  });

  resetSleepTimer();
</script>
</body>
</html>
